name: 打包 Windows 绿色一键包

# 两种用法都兼容：
#  A) fork 本仓库后加这个文件 —— Actions 直接打包 fork 里的源码
#  B) 新建一个空仓库只放这个文件 —— 脚本会自动 clone 上游源码
on:
  workflow_dispatch:
    inputs:
      with_admin:
        description: '同时构建 /admin 网页控制台（更慢、包更大）'
        type: boolean
        default: false
      publish_release:
        description: '同时发布到 Release（获得永久下载直链）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出（fork 模式下就是源码）
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: 准备 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: 构建并组装绿色包
        shell: pwsh
        env:
          WITH_ADMIN: ${{ inputs.with_admin }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Work = $env:GITHUB_WORKSPACE

          # ---------- 0. 定位源码 ----------
          $Repo = (Get-Location).Path
          if (-not (Test-Path (Join-Path $Repo 'package.json'))) {
            $Repo = Join-Path $env:RUNNER_TEMP 'fuckds-src'
            if (Test-Path $Repo) { Remove-Item $Repo -Recurse -Force }
            Write-Host "当前仓库没有源码，克隆上游到 $Repo"
            git clone --depth 1 https://github.com/xingling66666/fuckds.git $Repo
            if ($LASTEXITCODE -ne 0) { throw 'git clone 失败' }
          }
          Set-Location $Repo
          Write-Host "源码目录：$Repo"

          # ---------- 1. 依赖 + PoW 求解器 ----------
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'   # direct 引擎不需要 Chromium
          npm install
          if ($LASTEXITCODE -ne 0) { throw 'npm install 失败' }

          if ($env:WITH_ADMIN -eq 'true') {
            npm run admin:install
            if ($LASTEXITCODE -ne 0) { throw 'admin:install 失败' }
            npm run admin:build
            if ($LASTEXITCODE -ne 0) { throw 'admin:build 失败' }
          }

          New-Item -ItemType Directory -Path bin -Force | Out-Null
          $env:CGO_ENABLED = '0'
          go build -o bin\ds-pow.exe ./cmd/powd
          if ($LASTEXITCODE -ne 0) { throw 'go build 失败' }
          if (-not (Test-Path bin\ds-pow.exe)) { throw '未生成 bin\ds-pow.exe' }
          Write-Host 'PoW 求解器已编译'

          # ---------- 2. 便携 Node.exe ----------
          $Out = Join-Path $env:RUNNER_TEMP 'fuckds-onekey'
          if (Test-Path $Out) { Remove-Item $Out -Recurse -Force }
          New-Item -ItemType Directory -Path (Join-Path $Out 'runtime') -Force | Out-Null

          $nodeExe = $null
          $nodeZip = Join-Path $env:RUNNER_TEMP 'node-win.zip'
          $urls = @(
            'https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip',
            'https://npmmirror.com/mirrors/node/v22.14.0/node-v22.14.0-win-x64.zip'
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $nodeZip -UseBasicParsing -TimeoutSec 300
              $tmp = Join-Path $env:RUNNER_TEMP 'node-unzip'
              if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
              Expand-Archive -Path $nodeZip -DestinationPath $tmp -Force
              $found = Get-ChildItem -Path $tmp -Filter 'node.exe' -Recurse -File | Select-Object -First 1
              if ($found) { $nodeExe = $found.FullName; break }
            } catch {
              Write-Host "下载失败，换源：$u"
            }
          }
          if (-not $nodeExe) {
            $nodeExe = (Get-Command node).Source
            Write-Host "改用 setup-node 自带的 node.exe：$nodeExe"
          }
          Copy-Item $nodeExe (Join-Path $Out 'runtime\node.exe') -Force

          # ---------- 3. 复制源码与依赖 ----------
          # 注意：勾了 with_admin 后，npm --prefix web install 会在
          # web\node_modules\fuckds 建一个指向项目根的 junction（符号链接）。
          # Copy-Item -Recurse 会跟着它无限递归，路径越拼越长直到报错。
          # 改用 robocopy /XJ（跳过所有 reparse point）+ /XD 排除 node_modules。
          # 3a. 项目自身源码（含 web/dist、LICENSE、*.go 等，满足 AGPL 对应源码）
          & robocopy $Repo $Out /E /XJ /XD .git data node_modules 'web\node_modules' 'test\.artifacts' /XF .env '*.bak' fuckds-onekey-win-x64.zip /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy 源码失败（exit $LASTEXITCODE）" }
          Write-Host '源码复制完成'

          # 3b. 根 node_modules 单独复制（服务运行时需要 playwright 等）
          # /XJ 同样关键：npm 的 .bin、部分包内部也可能有 junction
          $nmSrc = Join-Path $Repo 'node_modules'
          if (Test-Path $nmSrc) {
            & robocopy $nmSrc (Join-Path $Out 'node_modules') /E /XJ /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8) { throw "robocopy node_modules 失败（exit $LASTEXITCODE）" }
            Write-Host 'node_modules 复制完成'
          }

          # 3c. 兜底自检：确认运行必需的文件都在
          foreach ($must in @('src\index.mjs', 'scripts\auth.mjs', 'bin\ds-pow.exe', 'runtime\node.exe')) {
            if (-not (Test-Path (Join-Path $Out $must))) { throw "包内缺少 $must" }
          }
          if (-not (Test-Path (Join-Path $Out 'LICENSE'))) { Write-Host '提示：仓库里没有 LICENSE 文件' }
          Write-Host '包内关键文件校验通过'

          # ---------- 4. 写配置与启动脚本（UTF-8 无 BOM） ----------
          function Write-NoBom($path, $lines) {
            $text = ($lines -join "`r`n") + "`r`n"
            [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          }

          Write-NoBom (Join-Path $Out '.env') @(
            'ENGINE=direct'
            'POW_BIN=bin/ds-pow.exe'
            'HOST=127.0.0.1'
            'PORT=8787'
            'API_KEY='
            'CORS_ORIGIN=*'
            'DEEPSEEK_THINKING=always'
          )

          Write-NoBom (Join-Path $Out '启动.bat') @(
            '@echo off'
            'chcp 65001 >nul'
            'title fuckds'
            'cd /d "%~dp0"'
            'set "DATA_DIR=%USERPROFILE%\.fuckds"'
            'if not exist "%DATA_DIR%" mkdir "%DATA_DIR%"'
            'if not exist "%DATA_DIR%\auth.json" ('
            '  echo.'
            '  echo  首次使用：粘贴 DeepSeek 网页版 userToken 后回车'
            '  echo  取法：登录 chat.deepseek.com - F12 - Application - Local Storage - userToken - value'
            '  echo.'
            '  "runtime\node.exe" "scripts\auth.mjs"'
            '  echo.'
            ')'
            'echo.'
            'echo  健康检查： http://127.0.0.1:8787/healthz'
            'echo  Base URL ： http://127.0.0.1:8787/v1    模型：deepseek-flash'
            'echo  关闭本窗口即停止服务'
            'echo.'
            '"runtime\node.exe" "src\index.mjs"'
            'pause'
          )

          Write-NoBom (Join-Path $Out '重配Token.bat') @(
            '@echo off'
            'chcp 65001 >nul'
            'title fuckds - 重配 Token'
            'cd /d "%~dp0"'
            'set "DATA_DIR=%USERPROFILE%\.fuckds"'
            '"runtime\node.exe" "scripts\auth.mjs"'
            'pause'
          )

          Write-NoBom (Join-Path $Out '说明.txt') @(
            'fuckds Windows 绿色一键包（由 GitHub Actions 自动构建）'
            ''
            '1. 解压到纯英文路径（不要放中文目录、不要放 Program Files）'
            '2. 双击「启动.bat」，首次粘贴 userToken 后回车'
            '3. 浏览器打开 http://127.0.0.1:8787/healthz 检查状态'
            '4. 客户端填：Base URL = http://127.0.0.1:8787/v1 ，模型 = deepseek-flash ，Key 随便填'
            '5. 换账号 / token 失效：双击「重配Token.bat」'
            ''
            '已内置 node.exe 与 ds-pow.exe，本机不需要安装 Node / Go / git。'
            '登录态与日志保存在 %USERPROFILE%\.fuckds ，重新解压不会丢。'
            '服务只监听 127.0.0.1；需要鉴权请在 .env 里设置 API_KEY，请勿暴露到公网。'
            ''
            '本包含完整对应源码，许可证 AGPLv3，见 LICENSE。'
            '第三方逆向项目，请遵守 DeepSeek 服务条款；账号限流/风控/封禁风险自负，'
            '仅限个人自用，不要对外提供服务或商用。'
          )

          # ---------- 5. 压缩 ----------
          $zipOut = Join-Path $Work 'fuckds-onekey-win-x64.zip'
          if (Test-Path $zipOut) { Remove-Item $zipOut -Force }
          $7z = 'C:\Program Files\7-Zip\7z.exe'
          if (Test-Path $7z) {
            & $7z a -tzip -mx=5 $zipOut $Out | Out-Null
            if ($LASTEXITCODE -ne 0) { throw '7z 压缩失败' }
          } else {
            Compress-Archive -Path $Out -DestinationPath $zipOut -CompressionLevel Optimal -Force
          }
          $hash = (Get-FileHash $zipOut -Algorithm SHA256).Hash
          Write-Host ('完成：{0:N1} MB  SHA256={1}' -f ((Get-Item $zipOut).Length / 1MB), $hash)

      - name: 上传 zip（在页面底部 Artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: fuckds-onekey-win-x64
          path: fuckds-onekey-win-x64.zip
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 Release（可选）
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-${{ github.run_number }}
          name: Windows 绿色一键包 #${{ github.run_number }}
          files: fuckds-onekey-win-x64.zip
          body: |
            由 GitHub Actions 在 windows-latest 上自动构建。

            解压到纯英文路径，双击「启动.bat」，粘贴 userToken 即可；本机无需 Node / Go / git。
            源码随包附带（AGPLv3，见 LICENSE）。

            仅限个人自用，请遵守 DeepSeek 服务条款。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
